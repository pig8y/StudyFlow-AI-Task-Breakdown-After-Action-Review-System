<!DOCTYPE html>
    <head>
        <title>form website</title>
    </head>

    <body>
        <form action="action_page.php" method="GET">
            <div>
                <label for="fname">first name:</label>
                <input type = "text" id="fname" name="fname" placeholder="e.g. pig8y" required>
            </div>
            
            <br>

            <div>
                <label for="lname">last name:</label>
                <input type="text" id="lname" name="lname" placeholder="e.g. Verstappen" required>
            </div>

            <br>

            <div>
                <label for="password">password:</label>
                <input type="password" id="password" name="password" required max="18">
            </div>

            <br>

            <div>
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" required placeholder="e.g. pig8yVers@gmail.com">

            </div>

            <br>

            <div>
                <label for="BD">Birthdate</label>
                <input type="date" id="BD" name="BD" required>
            </div>

            <br>

            <div>
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity" required min="0" max="99">
            </div>

            <br>

            <div>
                <label for="title">title:</label>

                <label for="name">MR.</label>
                <input type="radio" name="title">

                <label for="name">MS.</label>
                <input type="radio" name="title">
                
                <label for="name">PhD.</label>
                <input type="radio" name="title">
            </div>

            <div>
                <input type="reset">
            </div>

            <div>
                <input type="submit">
            </div>

        </form>
    </body>
